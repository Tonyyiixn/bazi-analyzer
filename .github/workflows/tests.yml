# Runs on every push and PR. Render waits for these checks to pass before
# deploying main (autoDeployTrigger: checksPass in render.yaml), so a commit
# that breaks the tests or the frontend build never reaches production.
name: tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Match the Dockerfile, not a local venv - production is what counts.
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # No secrets needed: agent tests replay recorded Claude responses
      # (core/agent/replay.py) instead of calling the API.
      - run: python -m pytest -q tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
